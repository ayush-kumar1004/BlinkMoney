<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary": "#4a2533", "surface-med": "#1A1A1A", "on-secondary-fixed": "#092100", "secondary-container": "#53b900", "on-tertiary-fixed": "#31101e", "on-secondary-container": "#194200", "text-primary": "#FFFFFF", "text-secondary": "#808080", "surface-tint": "#91d963", "primary-container": "#9fe870", "on-error": "#690005", "primary-fixed-dim": "#91d963", "primary-fixed": "#acf67c", "outline": "#8b9481", "tertiary-fixed-dim": "#f0b7c9", "tertiary-container": "#ffc5d7", "on-tertiary-fixed-variant": "#643a49", "error-container": "#93000a", "surface-high": "#1F1F1F", "on-primary-fixed-variant": "#225100", "inverse-on-surface": "#313030", "surface-container-low": "#1c1b1b", "error": "#FF5854", "tertiary-fixed": "#ffd9e3", "on-secondary": "#143800", "border-neutral": "rgba(255,255,255,0.06)", "surface-bright": "#3a3939", "on-primary-fixed": "#092100", "on-secondary-fixed-variant": "#215100", "surface-container-highest": "#353534", "secondary-fixed-dim": "#76df35", "surface-dim": "#131313", "on-primary-container": "#2e6900", "surface-highest": "#242424", "secondary": "#76df35", "text-near-white": "#F3F3F3", "outline-variant": "#41493a", "tertiary": "#ffecf0", "on-background": "#e5e2e1", "on-error-container": "#ffdad6", "text-tertiary": "#4D4D4D", "surface-low": "#141414", "surface-container-lowest": "#0e0e0e", "inverse-surface": "#e5e2e1", "surface-variant": "#353534", "border-brand": "#1A3300", "inverse-primary": "#2f6c00", "green-glass": "rgba(159,232,112,0.12)", "on-tertiary-container": "#7b4f5e", "surface-container-high": "#2a2a2a", "on-surface-variant": "#c1cab5", "on-surface": "#e5e2e1", "surface-container": "#201f1f", "deep-green": "#0D1F00", "primary": "#d0ffad", "surface": "#131313", "secondary-fixed": "#91fc50", "background": "#131313", "on-primary": "#153800" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "md": "12px", "lg": "16px", "xl": "20px", "sm": "8px", "xs": "4px", "4xl": "40px", "3xl": "32px", "card-padding": "16px", "2xl": "24px", "gutter": "20px" }, "fontFamily": { "hero": ["Playfair Display"], "body-md": ["Mulish"], "micro": ["Mulish"], "title-lg": ["Mulish"], "sub-headline": ["Playfair Display"], "caption": ["Mulish"], "label-sm": ["Mulish"] }, "fontSize": { "hero": ["34px", { "lineHeight": "42px", "letterSpacing": "-0.01em", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "micro": ["10px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "700" }], "sub-headline": ["24px", { "lineHeight": "32px", "fontWeight": "500" }], "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "label-sm": ["14px", { "lineHeight": "20px", "fontWeight": "600" }] } } } }</script><style>@layer base { body { @apply bg-[#0C0C0C] text-on-surface antialiased; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } .no-scrollbar::-webkit-scrollbar { display: none; }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 bg-[#0C0C0C]/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between"><button class="w-11 h-11 flex items-center justify-start text-on-surface"><span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span></button><div class="flex-1 flex justify-center items-center gap-xs"><div class="w-1.5 h-1.5 rounded-full bg-primary"></div><div class="w-1.5 h-1.5 rounded-full bg-surface-highest"></div><div class="w-1.5 h-1.5 rounded-full bg-surface-highest"></div></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 pt-16 bg-[#0C0C0C]"><div class="px-gutter pt-lg"><div class="flex flex-col w-full h-full px-gutter pb-4xl">
<div class="flex-1 flex flex-col justify-center items-center max-w-md mx-auto w-full">
<h2 class="font-hero text-hero text-text-primary text-center mb-sm">What does your life cost each month?</h2>
<p class="font-body-md text-body-md text-text-secondary text-center mb-3xl">Be honest. This is the foundation of your freedom number.</p>
<div class="relative w-full mb-3xl group">
<span class="absolute left-6 top-1/2 -translate-y-1/2 font-hero text-[40px] text-text-secondary group-focus-within:text-primary transition-colors duration-300">₹</span>
<input class="w-full bg-surface-low border border-border-neutral rounded-2xl py-6 pl-16 pr-6 font-hero text-[48px] text-text-primary text-right focus:outline-none focus:border-border-brand focus:ring-1 focus:ring-border-brand transition-all duration-300 shadow-sm" id="cost-input" inputmode="numeric" placeholder="0" type="text">
<div class="absolute -bottom-6 right-0 font-caption text-caption text-text-tertiary" id="formatted-text">Zero Rupees</div>
</div>
<div class="flex flex-wrap justify-center gap-md mb-4xl">
<button class="px-lg py-sm rounded-full bg-surface-highest text-text-near-white font-label-sm text-label-sm border border-border-neutral hover:bg-surface-bright transition-colors amount-preset" data-value="20000">20k</button>
<button class="px-lg py-sm rounded-full bg-surface-highest text-text-near-white font-label-sm text-label-sm border border-border-neutral hover:bg-surface-bright transition-colors amount-preset" data-value="38000">38k</button>
<button class="px-lg py-sm rounded-full bg-surface-highest text-text-near-white font-label-sm text-label-sm border border-border-neutral hover:bg-surface-bright transition-colors amount-preset" data-value="50000">50k</button>
<button class="px-lg py-sm rounded-full bg-surface-highest text-text-near-white font-label-sm text-label-sm border border-border-neutral hover:bg-surface-bright transition-colors amount-preset" data-value="100000">1L</button>
</div>
</div>
<div class="mt-auto pt-lg">
<button class="w-full bg-primary text-deep-green font-label-sm text-label-sm py-4 rounded-lg hover:bg-primary-fixed transition-colors shadow-md flex items-center justify-center gap-sm group">
            Continue
            <span class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('cost-input');
            const presets = document.querySelectorAll('.amount-preset');
            const formattedText = document.getElementById('formatted-text');

            const numberToWords = (num) => {
                if (num === 0) return 'Zero Rupees';
                if (num >= 100000) return `${(num / 100000).toFixed(1).replace(/\.0$/, '')} Lakh Rupees`;
                if (num >= 1000) return `${(num / 1000).toFixed(1).replace(/\.0$/, '')} Thousand Rupees`;
                return `${num} Rupees`;
            };

            const formatCurrency = (value) => {
                const numericString = value.replace(/[^0-9]/g, '');
                if (!numericString) return '';
                const num = parseInt(numericString, 10);
                return num.toLocaleString('en-IN');
            };

            input.addEventListener('input', (e) => {
                const rawValue = e.target.value.replace(/[^0-9]/g, '');
                if(rawValue) {
                     e.target.value = formatCurrency(rawValue);
                     const num = parseInt(rawValue, 10);
                     formattedText.textContent = numberToWords(num);
                     formattedText.classList.add('text-primary');
                     formattedText.classList.remove('text-text-tertiary');
                } else {
                     e.target.value = '';
                     formattedText.textContent = 'Zero Rupees';
                     formattedText.classList.remove('text-primary');
                     formattedText.classList.add('text-text-tertiary');
                }
            });

            presets.forEach(btn => {
                btn.addEventListener('click', () => {
                    const val = btn.getAttribute('data-value');
                    input.value = formatCurrency(val);
                    const num = parseInt(val, 10);
                    formattedText.textContent = numberToWords(num);
                    formattedText.classList.add('text-primary');
                    formattedText.classList.remove('text-text-tertiary');
                });
            });
        });
    </script>
</div></div></main>

</body></html>
