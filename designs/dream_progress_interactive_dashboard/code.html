<script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentPercentage = 29;
      const targetAmount = 72450;
      
      const percentageEl = document.getElementById('percentage-val');
      const amountEl = document.getElementById('amount-val');
      const progressRing = document.getElementById('main-progress-ring');
      const progressBar = document.getElementById('main-progress-bar');
      const addBtn = document.getElementById('add-funds-btn');

      const circleCircumference = 534;

      function updateProgress(percent) {
        const offset = circleCircumference - (percent / 100) * circleCircumference;
        progressRing.style.strokeDashoffset = offset;
        progressBar.style.width = `${percent}%`;
      }

      function animateValue(obj, start, end, duration, isCurrency = false) {
        let startTimestamp = null;
        const step = (timestamp) => {
          if (!startTimestamp) startTimestamp = timestamp;
          const progress = Math.min((timestamp - startTimestamp) / duration, 1);
          const currentVal = Math.floor(progress * (end - start) + start);
          
          if(isCurrency) {
              obj.innerHTML = currentVal.toLocaleString('en-IN');
          } else {
              obj.innerHTML = (currentVal + (progress < 1 ? 0 : end % 1 !== 0 ? (end%1).toFixed(1).substring(1) : ''));
          }
          
          if (progress < 1) {
            window.requestAnimationFrame(step);
          }
        };
        window.requestAnimationFrame(step);
      }

      // Initial Animation
      setTimeout(() => {
        updateProgress(currentPercentage);
        animateValue(percentageEl, 0, currentPercentage, 1500);
        animateValue(amountEl, 0, targetAmount, 1500, true);
      }, 100);

      // Button Interaction
      addBtn.addEventListener('click', () => {
        currentPercentage += 0.5;
        
        // Quick transitions for the nudge
        progressRing.style.transition = 'stroke-dashoffset 0.3s ease-out';
        progressBar.style.transition = 'width 0.3s ease-out';
        
        updateProgress(currentPercentage);
        percentageEl.innerHTML = currentPercentage;
        amountEl.innerHTML = (targetAmount + 21).toLocaleString('en-IN');
      });
    });
  </script>
